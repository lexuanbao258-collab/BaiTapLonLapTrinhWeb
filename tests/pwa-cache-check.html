<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TaskFlow PWA cache check</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 60rem; }
      button { padding: .6rem 1rem; cursor: pointer; }
      pre { padding: 1rem; background: #111827; color: #e5e7eb; white-space: pre-wrap; }
      .ok { color: #065f46; }
      .fail { color: #991b1b; }
    </style>
  </head>
  <body>
    <h1>Kiểm tra cache PWA</h1>
    <button id="run" type="button">Chạy kiểm tra</button>
    <pre id="result" aria-live="polite">Chưa chạy.</pre>

    <script>
      'use strict';

      (() => {
        const CACHE_NAME = 'taskflow-v1.7.4';
        const requiredAssets = [
          '../index.html',
          '../profile.html',
          '../assets/css/style.css',
          '../assets/css/responsive.css',
          '../assets/js/core/config.js',
          '../assets/js/core/theme-bootstrap.js',
          '../assets/js/services/backup-service.js',
          '../assets/js/services/auth-service.js',
          '../assets/js/services/csv-service.js',
          '../assets/js/components/task-actions.js',
          '../assets/js/pages/settings-page.js',
          '../assets/js/pages/profile-page.js',
          '../assets/js/pages/tasks-page.js',
          '../tests/mobile-interaction-check.html'
        ];
        const output = document.querySelector('#result');
        const button = document.querySelector('#run');
        const assert = (condition, message) => {
          if (!condition) {
            throw new Error(message);
          }
        };
        const waitForActiveWorker = async registration => {
          const deadline = Date.now() + 10000;

          while (Date.now() < deadline) {
            if (registration.active) {
              return registration.active;
            }

            await new Promise(resolve => window.setTimeout(resolve, 100));
            registration = await navigator.serviceWorker.getRegistration('../') || registration;
          }

          return null;
        };
        const run = async () => {
          button.disabled = true;
          output.className = '';
          output.textContent = 'Đang chạy…';

          try {
            assert('serviceWorker' in navigator, 'Browser does not support Service Worker.');
            const registration = await navigator.serviceWorker.register('../service-worker.js', {
              scope: '../'
            });
            const worker = await waitForActiveWorker(registration);

            assert(worker, 'Service Worker did not activate within 10 seconds.');

            const cacheNames = await caches.keys();

            assert(cacheNames.includes(CACHE_NAME), 'Expected versioned cache was not created.');
            const cache = await caches.open(CACHE_NAME);
            const missing = [];

            for (const asset of requiredAssets) {
              const response = await cache.match(new URL(asset, location.href).href);

              if (!response) {
                missing.push(asset);
              }
            }

            assert(!missing.length, `Missing cache assets: ${missing.join(', ')}`);
            output.className = 'ok';
            output.textContent = `PWA cache ${CACHE_NAME} contains all required static assets: PASS`;
          } catch (error) {
            output.className = 'fail';
            output.textContent = `FAIL: ${error.message}`;
          } finally {
            button.disabled = false;
          }
        };

        button.addEventListener('click', run);

        if (new URLSearchParams(location.search).get('run') === '1') {
          run();
        }
      })();
    </script>
  </body>
</html>
